name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  python:
    name: Python coverage and corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=backend --cov=ingestion --cov=evaluation --cov-report=term-missing --cov-fail-under=100
      - name: Validate committed production index
        run: python -c "from pathlib import Path; from backend.index_store import IndexStore; store = IndexStore.load(Path('data/index/swk501-v2.json.gz')); assert len(store.artifact.documents) == 6 and len(store.artifact.chunks) == 137"

  playwright:
    name: Deterministic Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
